name: Release packaging check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  installer-topology:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34
      - name: Build fixture binaries without publishing
        env:
          GOCACHE: ${{ runner.temp }}/flora-installer-go-cache
        run: |
          nix develop --command make deps build-linux
          CGO_ENABLED=0 nix develop --command go -C backend test -c -o ../bin/docker-network-test ./internal/docker
          CGO_ENABLED=0 nix develop --command go -C backend test -c -o ../bin/provisioning-test ./internal/provisioning
      - name: Exercise owned bridge, scoped firewall, bound HTTP-01 and protected enrollment inside a disposable nested Engine
        run: |
          docker build -f scripts/installer-network.Dockerfile -t flora-installer-fixture:ci .
          docker run --rm --privileged --label flora.fixture=installer -e FLORA_DISPOSABLE_FIXTURE=1 \
            --mount type=bind,src="$PWD/bin/flora-linux-${{ matrix.arch }}",dst=/flora,readonly \
            --mount type=bind,src="$PWD/bin/docker-network-test",dst=/docker-network-test,readonly \
            flora-installer-fixture:ci
      - name: Exercise complete install, resume and uninstall with real systemd in an owned container
        env:
          GOCACHE: ${{ runner.temp }}/flora-installer-go-cache
        run: nix develop --command bash scripts/check-installer-systemd.sh flora-installer-fixture:ci ${{ matrix.arch }}

  archive:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34
      - name: Check publication guards and exact local-image reuse
        run: python3 -m unittest discover -s scripts -p 'release_*_test.py'
      - name: Build local fixture image and record its actual registry digest
        run: |
          set -euo pipefail
          docker run -d --name flora-release-registry -p 127.0.0.1:51818:5000 registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          docker build -t localhost:51818/flora-agent:fixture agent/image
          docker push localhost:51818/flora-agent:fixture
          image=$(docker inspect --format '{{index .RepoDigests 0}}' localhost:51818/flora-agent:fixture)
          echo "FIXTURE_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Build both archived binaries
        run: |
          nix develop --command make deps web
          nix develop --command bash scripts/package-release.sh v0.0.0-fixture "$FIXTURE_IMAGE"
      - name: Check archive as a non-root service account with real Docker
        run: |
          docker pull "$FIXTURE_IMAGE"
          docker rm -f flora-release-registry
          sudo bash scripts/check-release-linux.sh dist/flora-v0.0.0-fixture-linux-${{ matrix.arch }}.tar.gz
      - name: Remove only fixture registry
        if: always()
        run: |
          if docker container inspect flora-release-registry >/dev/null 2>&1; then
            docker rm -f flora-release-registry
          fi
