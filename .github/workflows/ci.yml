name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34
      - name: Install locked dependencies
        run: nix develop --command make deps
      - name: Check Go and TypeScript; build and exercise the standalone binary
        run: nix develop --command make check smoke build-linux
      - name: Install Chromium and check the browser chat workflow
        run: nix develop --command npx playwright install --with-deps chromium && nix develop --command make browser

  agent-image:
    # Native Linux with the runner's uid (1001) differing from the image's
    # default agent uid (1000), so the storage-ownership mapping is genuinely
    # exercised; desktop Docker masks it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34
      - name: Build the pinned agent image
        run: docker build -t flora-agent-test:ci agent/image
      - name: Run live provisioning lifecycle tests against the daemon
        run: FLORA_PROVISIONING_TEST_IMAGE=flora-agent-test:ci nix develop --command go -C backend test -race -count=1 -v -run TestProvisioningDocker ./internal/provisioning
      - name: Check container checkout against the local GitHub fixture
        env:
          FLORA_GITHUB_TEST_IMAGE: flora-agent-test:ci
          FLORA_BROKER_GH_TOKEN: ""
        run: nix develop --command go -C backend test -race -count=1 -v -run '^TestCheckoutDocker$' ./internal/githubbroker
      - name: Check persistent turns against pinned OpenCode and a local provider fixture
        run: FLORA_CHAT_TEST_IMAGE=flora-agent-test:ci FLORA_CHAT_TEST_LSP=1 FLORA_CHAT_PROVIDER_HOST="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')" nix develop --command go -C backend test -race -count=1 -v -run '^TestChatDocker$' ./internal/chat
      - name: Check review retention after container stop and removal
        env:
          FLORA_CHANGES_DOCKER_TEST: "1"
          FLORA_CHANGES_TEST_IMAGE: flora-agent-test:ci
        run: nix develop --command go -C backend test -race -count=1 -v -run '^TestDockerCaptureAndRemoval$' ./internal/changes
