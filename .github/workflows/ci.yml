name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_DAEMON: 'false'
  GOTOOLCHAIN: local
  NX_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
  NX_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  CHECK_TARGETS: frontend-check,styleguide,go-check,race,smoke,browser

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      check: ${{ steps.plan.outputs.check }}
      agent: ${{ steps.plan.outputs.agent }}
      package: ${{ steps.plan.outputs.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          install_url: https://releases.nixos.org/nix/nix-2.29.2/install
          install_options: --no-daemon
          extra_nix_config: accept-flake-config = true
      - name: Install task runner
        run: nix develop --command npm ci
      - name: Select affected checks
        id: plan
        shell: nix develop --command bash -euo pipefail {0}
        run: |
          selection=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            selection=(--affected)
          fi
          for group in check agent package; do
            case "$group" in
              check) targets=$CHECK_TARGETS ;;
              agent) targets=container-check ;;
              package) targets=package-check ;;
            esac
            projects=$(npx nx show projects "${selection[@]}" --with-target="$targets" --json)
            echo "$group=$(jq "length > 0" <<< "$projects")" >> "$GITHUB_OUTPUT"
          done

  check:
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          install_url: https://releases.nixos.org/nix/nix-2.29.2/install
          install_options: --no-daemon
          extra_nix_config: accept-flake-config = true
      - name: Restore Go build and dependency caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.npm
          key: build-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('flake.lock', 'backend/go.sum', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('flake.lock', 'backend/go.sum', 'package-lock.json') }}-
      - name: Install locked dependencies
        run: nix develop --command make deps
      - name: Run selected checks
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            nix develop --command npx nx affected -t "$CHECK_TARGETS" --parallel=1 --output-style=static
          else
            nix develop --command npx nx run-many -t "$CHECK_TARGETS" --parallel=1 --output-style=static
          fi

      - name: Save browser failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  agent-image:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    # Native Linux exercises ownership mapping with a different host and image uid.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          install_url: https://releases.nixos.org/nix/nix-2.29.2/install
          install_options: --no-daemon
          extra_nix_config: accept-flake-config = true
      - name: Restore Go build and dependency caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.npm
          key: build-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('flake.lock', 'backend/go.sum', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('flake.lock', 'backend/go.sum', 'package-lock.json') }}-
      - name: Install task runner
        run: nix develop --command npm ci
      - name: Run container integration tests
        run: nix develop --command npx nx run agent:container-check --output-style=static

  packaging:
    needs: changes
    if: needs.changes.outputs.package == 'true'
    uses: ./.github/workflows/release-check.yml

  result:
    if: always()
    needs: [changes, check, agent-image, packaging]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful checks
        env:
          SUCCESS: ${{ needs.changes.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: test "$SUCCESS" = true
